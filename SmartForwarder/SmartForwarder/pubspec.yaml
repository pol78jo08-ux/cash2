name: smart_forwarder
description: تطبيق مراقبة وتحويل رسائل SMS لتليجرام - مراقبات متعددة قابلة للتخصيص
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # قراءة رسائل SMS (شغالة في الخلفية عبر background handler)
  telephony: ^0.2.0

  # يخلي التطبيق شغال Foreground Service محصّن ضد قيود MIUI/الشركات المصنّعة
  flutter_foreground_task: ^8.13.0

  # قاعدة بيانات محلية لتخزين المراقبات والسجل
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # تخزين مشفّر للتوكنات
  flutter_secure_storage: ^9.2.2

  # إرسال HTTP لتليجرام
  http: ^1.2.1

  # مراقبة حالة الاتصال بالإنترنت لإعادة إرسال الرسايل المعلّقة
  connectivity_plus: ^6.0.3

  # صلاحيات SMS بشكل نظيف
  permission_handler: ^11.3.1

  # تنسيق التاريخ والوقت في السجل
  intl: ^0.19.0

  # إدارة الحالة
  provider: ^6.1.2

  # فتح شاشات إعدادات أندرويد (autostart / تفاصيل التطبيق) مباشرة
  android_intent_plus: ^5.2.0

  # التعرف على الشركة المصنّعة للموبايل عشان نحدد شاشة الـ autostart الصح
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
